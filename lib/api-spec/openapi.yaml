openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ClipShare API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clips
    description: Clipboard item operations
  - name: storage
    description: Object storage operations
  - name: settings
    description: App settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /salt:
    get:
      operationId: getSalt
      tags: [settings]
      summary: Get or create the app-wide encryption salt
      description: Returns a stable salt used to derive the AES key from a passphrase. Generated once, stored server-side.
      responses:
        "200":
          description: Salt value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaltResponse"

  /clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: List all clipboard items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of clipboard items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipList"
    post:
      operationId: createClip
      tags: [clips]
      summary: Create a new clipboard item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClipBody"
      responses:
        "201":
          description: Created clipboard item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"

  /clips/{id}:
    patch:
      operationId: updateClip
      tags: [clips]
      summary: Update a clipboard item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClipBody"
      responses:
        "200":
          description: Updated clipboard item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
    delete:
      operationId: deleteClip
      tags: [clips]
      summary: Delete a clipboard item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully

  /clips/summary:
    get:
      operationId: getClipSummary
      tags: [clips]
      summary: Get clipboard usage summary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipSummary"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SaltResponse:
      type: object
      properties:
        salt:
          type: string
      required:
        - salt

    ClipType:
      type: string
      enum: [text, link, file]

    Clip:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        type:
          $ref: "#/components/schemas/ClipType"
        fileName:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        objectPath:
          type: string
          nullable: true
        iv:
          type: string
          nullable: true
        encrypted:
          type: boolean
          nullable: true
        resourceType:
          type: string
          nullable: true
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - type
        - pinned
        - createdAt

    ClipList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Clip"
        total:
          type: integer
      required:
        - items
        - total

    CreateClipBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ClipType"
        fileName:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        objectPath:
          type: string
          nullable: true
        iv:
          type: string
          nullable: true
        encrypted:
          type: boolean
          nullable: true
        resourceType:
          type: string
          nullable: true
      required:
        - content
        - type

    UpdateClipBody:
      type: object
      properties:
        pinned:
          type: boolean
      required:
        - pinned

    ClipSummary:
      type: object
      properties:
        totalClips:
          type: integer
        textCount:
          type: integer
        linkCount:
          type: integer
        fileCount:
          type: integer
        recentClips:
          type: array
          items:
            $ref: "#/components/schemas/Clip"
      required:
        - totalClips
        - textCount
        - linkCount
        - fileCount
        - recentClips

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        resourceType:
          type: string
      required:
        - uploadURL
        - objectPath
        - resourceType
