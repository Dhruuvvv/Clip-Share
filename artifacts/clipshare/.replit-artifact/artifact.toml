kind = "web"
previewPath = "/"
title = "ClipShare"
version = "1.0.0"
id = "artifacts/clipshare"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20488

[services.development]
run = "pnpm --filter @workspace/clipshare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clipshare", "run", "build" ]
publicDir = "artifacts/clipshare/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20488"
BASE_PATH = "/"
