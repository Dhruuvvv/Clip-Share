[build]
  command = "pnpm --filter clipshare build"
  publish = "artifacts/clipshare/dist/public"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Proxy API requests to the backend server
# REPLACE the 'to' URL with your actual backend API URL
[[redirects]]
  from = "/api/*"
  to = "https://clipshare-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA catch-all redirect (MUST come after more specific redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200